{% extends 'base.html' %}

{% block title %}Cadastro - MotherClean{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h2><i class="fa-solid fa-pen-to-square"></i> Criar Conta</h2>
        <p class="subtitle">Cadastre-se para começar a aprender</p>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirmar Senha</label>
                <input type="password" id="password_confirm" name="password_confirm" required>
            </div>

            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>

        <div class="auth-footer">
            <p>Já tem uma conta? <a href="{% url 'login' %}">Faça login aqui</a></p>
        </div>
    </div>
</div>
{% endblock %}
